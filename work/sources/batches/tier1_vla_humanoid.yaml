conventions:
  source: 링크된 PDF의 첫 장을 1쪽으로 세었다. 위치는 필드별로 표시한다. 숫자가 들어가는 모델·환경 고유명은 논문 표기를 따른다.
  real_robot_tasks: unique_count는 해당 논문 실기 평가의 고유 과제 수를 확정한 경우에만 정수다. 부분집합·하한·로봇당 수는 reported_scopes로 보존한다.
  prior_work: 등록 ID가 있는 직접 선행을 포함한다. 관계 유형 및 중요도는 연구자 해석이다. 선행이나 후속 한계의 미확인은 해당 문헌이 없다는 뜻이 아니다.
  missing: 미확인. 적용되지 않는 VLA 또는 humanoid 블록은 생략한다.
records:
- registry_id: pr-0022
  title: 'RT-2: Vision-Language-Action Models Transfer Web Knowledge to Robotic Control'
  tier: 1
  limitations:
    paper_reported:
      value: 로봇 데이터에서 시연하지 않은 새 운동 기술을 웹 데이터만으로 획득하는 데 한계가 있다.
      source: https://arxiv.org/pdf/2307.15818#page=11
      location: §5 Limitations
    subsequent_work:
      registry_id: pr-0024
      value: 더 다양한 로봇 데이터에서는 공동 미세조정과 로봇 전용 미세조정 간 차이가 작았다. RT-2의 결과가 데이터 조성에 의존할 수 있다.
      source: https://arxiv.org/pdf/2310.08864#page=6
      location: RT-2-X ablation 행 (4), (7) 및 본문
  prior_work:
  - registry_id: pr-0023
    type: 확장
    interpretation: PaLM-E를 로봇 행동 토큰을 출력하도록 미세조정한 변형을 제시한다.
    source: https://arxiv.org/pdf/2307.15818#page=5
    location: 선행 방법을 설명하거나 채택한 본문
  importance:
    level: 핵심
    interpretation: 웹 지식을 로봇 행동으로 옮기는 효과와 새 운동 기술 습득을 구분할 출발점이다.
  vla:
    backbone:
      value: PaLI-X 또는 PaLM-E. 변형별 규모는 실험 설정에 따른다.
      source: https://arxiv.org/pdf/2307.15818#page=5
      location: §3 Model
      size_evidence:
        value: 최대 RT-2-PaLI-X 55B
        source: https://arxiv.org/pdf/2307.15818#page=6
        location: §3 real-time inference
    action_representation:
      value: 양자화한 로봇 행동을 이산 언어 토큰으로 출력한다.
      source: https://arxiv.org/pdf/2307.15818#page=5
      location: §3
    architecture:
      value: 시각·언어 입력과 행동 출력을 한 VLM에서 처리한다.
      source: https://arxiv.org/pdf/2307.15818#page=5
      location: §3, Fig. 2
    training:
      value: 웹 시각언어 과제와 로봇 시연을 공동 미세조정한다.
      source: https://arxiv.org/pdf/2307.15818#page=6
      location: §3 Training
    evaluation:
      value: 실물 팔에서 학습 분포, 새 물체·환경, 발현 능력을 별도 평가한다.
      source: https://arxiv.org/pdf/2307.15818#page=7
      location: §4.1 및 §4.2
    real_robot_tasks:
      unique_count: 미확인
      reported_scopes:
      - value: '>200'
        scope: 학습 분포에서 평가한 과제
        source: https://arxiv.org/pdf/2307.15818#page=7
        location: §4.1 In-distribution
      - value: '>280'
        scope: 일반화 평가 과제. 앞 집합과의 중복 미확인
        source: https://arxiv.org/pdf/2307.15818#page=8
        location: §4.1 Generalization
- registry_id: pr-0024
  title: 'Open X-Embodiment: Robotic Learning Datasets and RT-X Models'
  tier: 1
  limitations:
    paper_reported:
      value: 평가에 등장한 기종 사이 전이를 시험했다. 새로운 로봇에 대한 일반화와 양의 전이 발생 조건은 열린 문제로 남겼다.
      source: https://arxiv.org/pdf/2310.08864#page=7
      location: §VI, pp.6–7
    subsequent_work:
      registry_id: pr-0051
      value: WidowX의 기본 정책 비교에서 RT-2-X가 의미 일반화에 강했지만 여러 시각 변화와 물체 지정 과제에서는 OpenVLA가 더 높은 성공률을 보고했다. 비교 조건은 Fig. 3에 한정된다.
      source: https://arxiv.org/pdf/2406.09246#page=7
      location: §5 및 Fig. 3, BridgeData V2 WidowX
  prior_work:
  - registry_id: pr-0021
    type: 확장
    interpretation: RT-1을 여러 기종의 데이터로 학습한다.
    source: https://arxiv.org/pdf/2310.08864#page=4
    location: 선행 방법을 설명하거나 채택한 본문
  - registry_id: pr-0022
    type: 확장
    interpretation: RT-2의 PaLI-X 변형을 여러 기종의 데이터로 학습한다.
    source: https://arxiv.org/pdf/2310.08864#page=4
    location: 선행 방법을 설명하거나 채택한 본문
  importance:
    level: 핵심
    interpretation: 기종 간 양의 전이를 주장할 때 필요한 데이터 구성과 비교 정책을 보여준다.
  vla:
    backbone:
      value: RT-2-X는 PaLI-X, 별도 비교 모델 RT-1-X는 RT-1 기반이다.
      source: https://arxiv.org/pdf/2310.08864#page=4
      location: §IV, Fig. 3
      size_evidence:
        value: RT-2-X ablation의 55B 및 5B 구성
        source: https://arxiv.org/pdf/2310.08864#page=6
        location: ablation table의 Size 열
    action_representation:
      value: 두 계열 모두 이산화된 행동을 예측한다.
      source: https://arxiv.org/pdf/2310.08864#page=4
      location: §IV, Fig. 3
    architecture:
      value: 입출력 규약을 공유하는 별개 정책을 비교한다.
      source: https://arxiv.org/pdf/2310.08864#page=4
      location: §IV
    training:
      value: 여러 기종의 시연을 혼합하며 RT-2-X에서는 웹 데이터 공동학습을 비교한다.
      source: https://arxiv.org/pdf/2310.08864#page=6
      location: ablation, 행 (4), (7)
    evaluation:
      value: 실물 기종 간 성능 전이, 새 기술과 일반화를 평가한다. 원문에서 데이터셋의 과제 수와 평가 시행 수를 구별한다.
      source: https://arxiv.org/pdf/2310.08864#page=5
      location: §V 및 Table I
    real_robot_tasks:
      unique_count: 미확인
- registry_id: pr-0052
  title: 'Octo: An Open-Source Generalist Robot Policy'
  tier: 1
  limitations:
    paper_reported:
      value: 사전학습 데이터 선별과 혼합 비율을 체계화하는 문제를 후속 과제로 둔다.
      source: https://arxiv.org/pdf/2405.12213#page=8
      location: Data mixture ablation
    subsequent_work:
      registry_id: pr-0886
      value: 정밀 실물 조작에서 Octo를 사람 시연으로만 미세조정한 조건과 RL 전문가 시연을 사용한 조건의 차이를 보고했다. 사용한 학생과 과제에 한정한 비교다.
      source: https://arxiv.org/pdf/2412.09858#page=6
      location: §5, task success by policy and data source
  prior_work:
  - registry_id: pr-0024
    type: 결합
    interpretation: Open X-Embodiment 시연으로 범용 정책을 사전학습한다.
    source: https://arxiv.org/pdf/2405.12213#page=2
    location: 선행 방법을 설명하거나 채택한 본문
  - registry_id: pr-0019
    type: 결합
    interpretation: Diffusion Policy의 확산 목적함수를 행동 헤드에 쓴다.
    source: https://arxiv.org/pdf/2405.12213#page=5
    location: 선행 방법을 설명하거나 채택한 본문
  importance:
    level: 핵심
    interpretation: 공개된 범용 정책의 행동 생성부를 RL로 바꾸는 연구에 비교점을 제공한다.
  vla:
    backbone:
      value: 자체 트랜스포머와 T5-base 텍스트 인코더. 인코더 111M은 전체 정책 크기와 다르다.
      source: https://arxiv.org/pdf/2405.12213#page=4
      location: §III, Task tokens
      size_evidence:
        value: 공개 Octo 정책 크기 27M·93M. 언어 인코더 크기와 별도.
        source: https://arxiv.org/pdf/2405.12213#page=2
        location: Introduction, released checkpoints
    action_representation:
      value: 연속 행동 청크를 확산 헤드에서 생성한다.
      source: https://arxiv.org/pdf/2405.12213#page=5
      location: §III-C
    architecture:
      value: 언어 또는 목표 영상 토큰을 조건으로 하는 단일 정책이다.
      source: https://arxiv.org/pdf/2405.12213#page=4
      location: §III
    training:
      value: 여러 로봇의 시연으로 사전학습한 뒤 센서와 행동 공간을 바꿔 미세조정한다.
      source: https://arxiv.org/pdf/2405.12213#page=5
      location: §III Training
    evaluation:
      value: 실물 영점 전이와 다운스트림 미세조정은 다른 평가 묶음이다.
      source: https://arxiv.org/pdf/2405.12213#page=7
      location: §IV, 실물 평가 및 비교표
    real_robot_tasks:
      unique_count: 미확인
      reported_scopes:
      - value: 2
        scope: 해당 비교에서 로봇당 선택한 언어 과제. 전체 고유 과제 수 미확인
        source: https://arxiv.org/pdf/2405.12213#page=7
        location: §IV, in-distribution language
- registry_id: pr-0051
  title: 'OpenVLA: An Open-Source Vision-Language-Action Model'
  tier: 1
  limitations:
    paper_reported:
      value: 단일 영상 관측만 지원해 다양한 센서와 여러 시점을 직접 처리하기 어렵다.
      source: https://arxiv.org/pdf/2406.09246#page=11
      location: §6 Discussion and Limitations
    subsequent_work:
      registry_id: pr-0750
      value: 기본 OpenVLA 미세조정의 추론 속도와 고주파 정밀 과업의 신뢰도 한계를 지적하고 행동 청킹과 병렬 디코딩을 시험했다.
      source: https://arxiv.org/pdf/2502.19645#page=3
      location: 기본 모델 미세조정의 두 가지 한계
  prior_work:
  - registry_id: pr-0022
    type: 확장
    interpretation: RT-2가 사용한 행동 토큰화 접근을 공개 VLM 학습에 적용한다.
    source: https://arxiv.org/pdf/2406.09246#page=5
    location: 선행 방법을 설명하거나 채택한 본문
  importance:
    level: 핵심
    interpretation: VLA에서 행동 표현과 미세조정 방식만 바꾼 효과를 검토하기 좋은 공개 비교군이다.
  vla:
    backbone:
      value: Prismatic-7B. DINOv2·SigLIP 영상 특징과 Llama 계열 언어 백본을 사용한다.
      source: https://arxiv.org/pdf/2406.09246#page=4
      location: §3.1–3.2
    action_representation:
      value: 연속 제어값을 양자화한 이산 토큰을 자기회귀적으로 출력한다.
      source: https://arxiv.org/pdf/2406.09246#page=5
      location: §3.2
    architecture:
      value: 결합한 시각 특징과 지시를 받아 행동을 예측하는 단일 정책이다.
      source: https://arxiv.org/pdf/2406.09246#page=5
      location: §3.2 및 Fig. 2
    training:
      value: 사전학습 VLM을 로봇 시연의 다음 행동 토큰으로 지도 미세조정한다.
      source: https://arxiv.org/pdf/2406.09246#page=5
      location: §3.2
    evaluation:
      value: WidowX 및 Google 로봇의 기본 정책 비교와 별도로 새 로봇 적응을 평가한다.
      source: https://arxiv.org/pdf/2406.09246#page=7
      location: §5 및 Fig. 3; 전체 기본 비교 범위는 p.1 초록
    real_robot_tasks:
      unique_count: 미확인
      reported_scopes:
      - value: 29
        scope: 여러 기종에 걸친 대표 기본 모델 비교. 별도 적응 평가를 합산하지 않음
        source: https://arxiv.org/pdf/2406.09246#page=1
        location: Abstract; 실험 구성 §5, pp.7–9
- registry_id: pr-0746
  title: 'π0: A Vision-Language-Action Flow Model for General Robot Control'
  tier: 1
  limitations:
    paper_reported:
      value: 복잡한 과제는 고품질 후학습에 의존하고, 고품질 데이터만으로 학습한 정책은 오류에서 안정적으로 복구하지 못했다.
      source: https://arxiv.org/pdf/2410.24164#page=12
      location: Discussion
    subsequent_work:
      registry_id: pr-0061
      value: 새 가정 환경으로의 일반화를 별도 문제로 제기하고 기존 π0와 비교했다.
      source: https://arxiv.org/pdf/2504.16054#page=2
      location: Introduction, unknown homes and generalization
  prior_work:
  - registry_id: pr-0745
    type: 결합
    interpretation: 시각언어 모델과 flow matching 행동 생성을 결합한다.
    source: https://arxiv.org/pdf/2410.24164#page=3
    location: 선행 방법을 설명하거나 채택한 본문
  importance:
    level: 핵심
    interpretation: 연속 행동 생성부를 가진 VLA에 RL을 적용할 때의 기본 정책이다.
  vla:
    backbone:
      value: PaliGemma 3B와 별도 행동 전문가 모듈.
      source: https://arxiv.org/pdf/2410.24164#page=5
      location: §IV, Model architecture
      size_evidence:
        value: PaliGemma 3B, 행동 전문가 포함 정책 전체 3.3B
        source: https://arxiv.org/pdf/2410.24164#page=5
        location: Model architecture
    action_representation:
      value: 연속 행동 청크를 flow matching으로 생성한다.
      source: https://arxiv.org/pdf/2410.24164#page=4
      location: 모델 개요
    architecture:
      value: 공유 관측에 조건화한 하나의 정책 안에서 VLM과 행동 전문가가 상호작용한다.
      source: https://arxiv.org/pdf/2410.24164#page=5
      location: §IV
    training:
      value: 다양한 기종의 데이터로 사전학습하고 과제별 시연으로 후학습한다.
      source: https://arxiv.org/pdf/2410.24164#page=7
      location: Experiments
    evaluation:
      value: 실물 기본 정책 평가와 섬세한 조작의 후학습 평가를 나눴다.
      source: https://arxiv.org/pdf/2410.24164#page=7
      location: Experiments 및 p.11 discussion
    real_robot_tasks:
      unique_count: 미확인
