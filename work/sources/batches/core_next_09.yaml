    - 시험한 과제에서 행동 복제는 순응적이고 과감쇠인 조건의 이득을 보았으며, 강화학습은 설정 조정으로 여러 이득에 적응했고, 높은 강성과 과감쇠의 조합은 실물 전이에 불리했다.
