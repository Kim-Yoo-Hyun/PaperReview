  tier: 2
  one_line_summary: Force Policy는 접촉 중 힘을 조절할 방향과 위치를 제어할 방향을 나누는 좌표계를 시연에서 복원해 접촉 조작에 사용한다.
  key_contributions:
    - 비접촉 구간의 움직임은 전역 시각 정책이 정하고 접촉 중에는 고주파 힘 피드백을 쓰는 국소 정책이 좌표계를 추정해 힘·위치를 함께 제어한다.
    - 실제 로봇의 접촉 과제에서 물체 형상과 물성이 달라질 때 작업 성공뿐 아니라 목표 힘의 추종 정도와 접촉 안정성도 평가했다.
