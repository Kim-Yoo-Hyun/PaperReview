  modality_tags:
    - RGB
  data_source_tags:
    - 혼합
  openness:
    code: 부분
    weights: 부분
    data: 부분
  datasets_benchmarks:
    - RoboCasa 이동 조작
    - 실물 이동 조작
  limitations:
    paper_reported: 정책 실행 중 장면이 바뀌어도 장면 모델을 갱신하지 않는다.
