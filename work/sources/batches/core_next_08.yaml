  key_contributions:
    - 형상 사전정보로 질량–스프링 모델을 초기화하고 관측된 변형을 통해 물리 파라미터와 가우시안 외관 표현을 맞춘다.
    - 관측하지 않은 상호작용에서의 변형 예측을 평가하고 추정한 모델을 목표 형상으로 물체를 움직이는 로봇 계획에 사용했다.
